services:
  postgres:
    image: postgres:16-alpine
    container_name: mitbauen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    container_name: mitbauen-flyway
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitbauen-backend
    restart: unless-stopped
    environment:
      app_service_http_port: ${BACKEND_PORT:-8080}
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL}
      JDBC_DATABASE_USER: ${JDBC_DATABASE_USER}
      JDBC_DATABASE_PASSWORD: ${JDBC_DATABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    expose:
      - "${BACKEND_PORT:-8080}"

  nginx:
    image: nginx:1.27-alpine
    container_name: mitbauen-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./.artifacts/frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/deploy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
