name: Native E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  native-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mitbauen
          POSTGRES_USER: mitbauen
          POSTGRES_PASSWORD: mitbauen_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mitbauen -d mitbauen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-job-reports: 'true'

      - name: Run backend integration tests
        working-directory: backend
        run: mvn -q verify

      - name: Show backend coverage
        working-directory: backend
        run: |
          coverage="$(awk -F, 'NR > 1 { missed += $8; covered += $9 } END { total = missed + covered; if (total == 0) { printf "0.00" } else { printf "%.2f", (covered * 100) / total } }' target/site/jacoco-it/jacoco.csv)"
          echo "Backend line coverage: ${coverage}%"
          {
            echo "### Backend Coverage"
            echo
            echo "- Line coverage: ${coverage}%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend and native backend
        run: BUILD_NATIVE=1 SKIP_BACKEND_TESTS=1 ./build.sh

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run native full-stack E2E
        timeout-minutes: 10
        env:
          jdbc_database_url: jdbc:postgresql://127.0.0.1:5432/mitbauen
          jdbc_database_user: mitbauen
          jdbc_database_password: mitbauen_ci_password
          E2E_INVITE_HASH: 448a9e6bdd9366c7be474d74fce688484aaf2b2a350864e2c02ca86aaa86ce39
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: ./run-native-e2e.sh

      - name: Package native host deploy bundle
        run: DEPLOY_BACKEND_MODE=native DEPLOY_USE_EXISTING_ARTIFACTS=1 ./deploy.sh

      - name: Upload native deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: mitbauen-native-host-deploy
          path: |
            .artifacts/mitbauen-native-host-deploy.tgz
            .artifacts/backend/mitbauen-native-backend

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-logs
          path: |
            .tmp/native-e2e
            frontend/playwright-report
