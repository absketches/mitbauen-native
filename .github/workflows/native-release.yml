name: Native Release

on:
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Find successful Native E2E run
        id: native_e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/native-e2e.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="${GITHUB_SHA}" \
            --jq '.workflow_runs[0].id // empty')"

          if [ -z "$run_id" ]; then
            echo "No successful Native E2E run found for ${GITHUB_SHA} on main."
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download tested native artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .artifacts/downloaded .artifacts/release
          mkdir -p .artifacts/downloaded .artifacts/release
          gh run download "${{ steps.native_e2e.outputs.run_id }}" \
            --name mitbauen-native-host-deploy \
            --dir .artifacts/downloaded

      - name: Generate release version
        id: version
        run: |
          release_version="$(date -u '+%Y.%m.%j%H%M')"
          echo "value=${release_version}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Stage release assets
        run: |
          native_binary_path="$(find .artifacts/downloaded -type f -name 'mitbauen-native-backend' | head -n 1)"
          bundle_path="$(find .artifacts/downloaded -type f -name 'mitbauen-native-host-deploy.tgz' | head -n 1)"
          native_binary_name="mitbauen-native-backend-${RELEASE_VERSION}-linux-arm64"
          bundle_name="mitbauen-native-host-deploy-${RELEASE_VERSION}-linux-arm64.tgz"

          if [ -z "$native_binary_path" ] || [ ! -f "$native_binary_path" ]; then
            echo "Missing mitbauen-native-backend from upstream Native E2E artifact."
            exit 1
          fi
          if [ -z "$bundle_path" ] || [ ! -f "$bundle_path" ]; then
            echo "Missing mitbauen-native-host-deploy.tgz from upstream Native E2E artifact."
            exit 1
          fi

          cp "$native_binary_path" ".artifacts/release/${native_binary_name}"
          tar -czf ".artifacts/release/${native_binary_name}.tgz" -C .artifacts/release "${native_binary_name}"
          cp "$bundle_path" ".artifacts/release/${bundle_name}"

      - name: Set up Java for GitHub Packages
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish native image to GitHub Packages
        run: >
          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file
          -DrepositoryId=github
          -Durl=https://maven.pkg.github.com/${{ github.repository }}
          -DgroupId=io.github.absketches.mitbauen.nativeapp
          -DartifactId=mitbauen-native-backend
          -Dversion=${RELEASE_VERSION}
          -Dpackaging=tgz
          -Dclassifier=linux-arm64
          -Dfile=.artifacts/release/mitbauen-native-backend-${RELEASE_VERSION}-linux-arm64.tgz
          -DgeneratePom=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish host deploy bundle to GitHub Packages
        run: >
          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file
          -DrepositoryId=github
          -Durl=https://maven.pkg.github.com/${{ github.repository }}
          -DgroupId=io.github.absketches.mitbauen.nativeapp
          -DartifactId=mitbauen-native-host-deploy
          -Dversion=${RELEASE_VERSION}
          -Dpackaging=tgz
          -Dclassifier=linux-arm64
          -Dfile=.artifacts/release/mitbauen-native-host-deploy-${RELEASE_VERSION}-linux-arm64.tgz
          -DgeneratePom=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${RELEASE_VERSION}"
          ".artifacts/release/mitbauen-native-backend-${RELEASE_VERSION}-linux-arm64#Native backend (linux-arm64)"
          ".artifacts/release/mitbauen-native-host-deploy-${RELEASE_VERSION}-linux-arm64.tgz#Host deploy bundle (linux-arm64)"
          --generate-notes
          --title "${RELEASE_VERSION}"

      - name: Upload release build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-release-logs
          path: |
            .artifacts/downloaded
            .artifacts/release
