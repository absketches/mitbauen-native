version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00" # 7 AM UTC 
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00" # 8 AM UTC 
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Ignore non-stable releases
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"  # 9 AM UTC 
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
