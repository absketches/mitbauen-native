services:
  browser-tests:
    build:
      context: ./frontend
      target: browser-test
    container_name: mitbauen-browser-tests
    restart: "no"
    environment:
      CI: "true"

  postgres:
    image: postgres:16-alpine
    container_name: mitbauen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    container_name: mitbauen-flyway
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: mitbauen-backend
    environment:
      app_service_http_port: ${BACKEND_PORT:-8080}
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL}
      JDBC_DATABASE_USER: ${JDBC_DATABASE_USER}
      JDBC_DATABASE_PASSWORD: ${JDBC_DATABASE_PASSWORD}
    depends_on:
      browser-tests:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    expose:
      - "${BACKEND_PORT:-8080}"

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: mitbauen-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      browser-tests:
        condition: service_completed_successfully
    expose:
      - "${FRONTEND_PORT:-5173}"

  nginx:
    image: nginx:1.27-alpine
    container_name: mitbauen-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
