services:
  browser-tests:
    build:
      context: ./frontend
      target: browser-test
    container_name: mitbauen-browser-tests
    restart: "no"
    environment:
      CI: "true"

  postgres:
    image: postgres:16-alpine
    container_name: mitbauen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mitbauen-backend
    environment:
      app_service_http_port: 8080
      jdbc_database_url: ${JDBC_DATABASE_URL}
      jdbc_database_user: ${JDBC_DATABASE_USER}
      jdbc_database_password: ${JDBC_DATABASE_PASSWORD}
    depends_on:
      browser-tests:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  postgres_data:
